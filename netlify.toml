[build]
  command = "node scripts/build-static.js"
  publish = "public"

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200
[[redirects]]
  from = "/history"
  to = "/history.html"
  status = 200
[[redirects]]
  from = "/quiz/*"
  to = "/quiz.html"
  status = 200
[[redirects]]
  from = "/results/*"
  to = "/results.html"
  status = 200
