<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/style.css"><title>Create account | Quizify</title></head><body>
<main class="auth-wrap"><div class="glass auth-card">
  <a class="logo" href="/" data-logo></a>
  <h1>Create your account</h1><p class="sub">Register to start taking quizzes.</p>
  <form id="form" novalidate>
    <div class="form-error" id="formError" role="alert"></div>
    <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name" required><div class="err"></div></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><div class="err"></div></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters, with a number" required><div class="err"></div></div>
    <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" required><div class="err"></div></div>
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
  <p class="auth-alt">Already registered? <a href="/login">Log in</a></p>
</div></main>
<div class="toasts" id="toasts"></div>
<script src="/js/common.js"></script><script src="/js/auth.js"></script>
</body></html>
