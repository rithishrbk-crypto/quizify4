<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/style.css"><title>Log in | Quizify</title></head><body>
<main class="auth-wrap"><div class="glass auth-card">
  <a class="logo" href="/" data-logo></a>
  <h1>Welcome back</h1><p class="sub">Log in to continue your quizzes.</p>
  <form id="form" novalidate>
    <div class="form-error" id="formError" role="alert"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><div class="err"></div></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required><div class="err"></div></div>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="auth-alt">New to Quizify? <a href="/register">Create an account</a></p>
</div></main>
<div class="toasts" id="toasts"></div>
<script src="/js/common.js"></script><script src="/js/auth.js"></script>
</body></html>
